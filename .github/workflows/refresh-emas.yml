name: Refresh weekly EMAs

# Once daily after the NSE close (15:30 IST = 10:00 UTC); run 10:45 UTC so EOD
# data has settled. Weekdays only. Manual run available via "Run workflow".
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

# Prevent overlapping runs; let a newer run cancel an in-flight one.
concurrency:
  group: refresh-emas
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # Pinned so a breaking yfinance/curl_cffi release can't silently land in
        # the daily job (an all-symbol fetch failure would otherwise look benign).
        run: pip install --quiet "yfinance==1.5.1" "curl_cffi==0.15.0"

      - name: Compute EMAs
        run: python3 scripts/emas/compute_emas.py --source yf

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/emas.json; then
            echo "No EMA changes."
          else
            git config user.name  "ema-bot"
            git config user.email "ema-bot@users.noreply.github.com"
            git add src/data/emas.json
            git commit -m "data: refresh weekly EMAs"
            # Another commit (a data import, an overlapping run) may have advanced
            # the branch during the multi-minute compute; rebase before pushing so
            # the day's EMAs aren't lost to a rejected non-fast-forward push.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && break
              echo "push attempt $attempt failed; retrying"
              sleep 5
            done
          fi
